name: apex_video
description: ApexVideo — Flutter app using the Gemini API (Veo) to generate promo videos, merged with screen recordings via FFmpeg.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  file_picker: ^13.1.0
  path_provider: ^2.1.3
  flutter_dotenv: ^5.1.0
  video_player: ^2.9.1
  in_app_purchase: ^3.2.0
  shared_preferences: ^2.3.2
  share_plus: ^13.3.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/branding/
