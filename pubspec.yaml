name: apex_video
description: ApexVideo — AI promo videos with speech, made through the ApexVideo server (Gemini + MiniMax).
publish_to: 'none'
version: 1.0.2+2

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  provider: ^6.1.2
  file_picker: ^13.1.0
  path_provider: ^2.1.3
  video_player: ^2.9.1
  in_app_purchase: ^3.2.0
  shared_preferences: ^2.3.2
  share_plus: ^13.3.0
  url_launcher: ^6.3.1
  gal: ^2.3.3
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_native_splash:
  color: "#000000"
  image: assets/branding/apexvideo_splash_mark.png
  android: true
  ios: true
  fullscreen: true
